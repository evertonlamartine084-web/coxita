    <style>
      /* Os tokens sao os mesmos de src/index.css. Estao repetidos aqui de
         proposito: esta pagina precisa abrir sem o bundle do app -- e o motivo
         de ela existir e justamente o app nao estar servindo. */
      :root {
        --brand: #f28c28;
        --brown: #5d2b04;
        --text: #3d2410;
        --text-light: #7d5e47;
        --cream: #fff2e3;
        --bg: #fff9f2;
        --cactus: #4c7d2c;
        --cactus-dark: #3d651f;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: 'Barlow', system-ui, Arial, sans-serif;
        font-size: 17px;
        color: var(--text);
        /* O mesmo fundo do hero: laranja com a trama de pontos. */
        background-color: var(--brand);
        background-image: radial-gradient(rgba(93, 43, 4, 0.16) 1.5px, transparent 1.5px);
        background-size: 22px 22px;
      }

      .cartao {
        width: 100%;
        max-width: 480px;
        background: var(--bg);
        border: 3px solid var(--brown);
        border-radius: 20px;
        /* Sombra dura, como os botoes e molduras do site. */
        box-shadow: 8px 8px 0 rgba(93, 43, 4, 0.9);
        padding: 32px 24px 28px;
        text-align: center;
        animation: entrar 520ms cubic-bezier(0.28, 0.11, 0.32, 1) both;
      }

      @keyframes entrar {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .cartao { animation: none; }
      }

      .marca {
        width: min(220px, 62%);
        height: auto;
        margin: 0 auto 20px;
        display: block;
      }

      h1 {
        font-family: 'Barlow Condensed', 'Barlow', Arial, sans-serif;
        font-weight: 900;
        font-size: clamp(40px, 12vw, 58px);
        line-height: 0.92;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: var(--brown);
        margin: 0 0 12px;
      }

      .recado {
        margin: 0 auto 24px;
        max-width: 34ch;
        line-height: 1.5;
        color: var(--text);
      }

      .recado strong { color: var(--brown); }

      .whatsapp {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 54px;
        padding: 0 26px;
        border-radius: 999px;
        background: var(--cactus);
        color: #fff;
        font-family: 'Barlow Condensed', 'Barlow', Arial, sans-serif;
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
        border: 3px solid var(--brown);
        box-shadow: 4px 4px 0 rgba(93, 43, 4, 0.9);
        transition: transform 180ms cubic-bezier(0.4, 0, 0.2, 1),
                    box-shadow 180ms cubic-bezier(0.4, 0, 0.2, 1),
                    background-color 180ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .whatsapp:hover,
      .whatsapp:focus-visible {
        background: var(--cactus-dark);
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 rgba(93, 43, 4, 0.9);
      }

      .whatsapp:focus-visible {
        outline: 3px solid var(--brown);
        outline-offset: 3px;
      }

      .whatsapp svg { width: 24px; height: 24px; fill: currentColor; flex: none; }

      .numero {
        margin: 14px 0 0;
        font-size: 15px;
        color: var(--text-light);
      }

      .pe {
        margin: 24px 0 0;
        padding-top: 18px;
        border-top: 2px dashed rgba(93, 43, 4, 0.25);
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-light);
      }

      .pe a { color: var(--brown); font-weight: 600; }
    </style>
  </head>
